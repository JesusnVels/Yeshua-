name: Build Universal APK

# Triggers: push to main/dev, or manual dispatch from Actions tab
on:
  workflow_dispatch:
  push:
    branches: [ main, dev ]
    paths-ignore:
      - 'README*.md'
      - 'fastlane/**'
      - 'assets/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/FUNDING.yml'

permissions:
  contents: write

# ─────────────────────────────────────────────────────────────────────────────
# Single job: GMS · Mobile · Universal  (arm64 + armeabi + x86 + x86_64)
# This is the APK Jesus wants to distribute — one file, any device installs it.
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  build-universal:
    name: Build GMS · Mobile · Universal Release
    runs-on: ubuntu-latest

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # ── Yeshua overlay guard ─────────────────────────────────────────────
      # Fails fast (~20s) if the Yeshua source overlay was not applied to this
      # commit, instead of burning a full ~7-min Gradle build before failing.
      - name: Verify Yeshua overlay is applied
        run: |
          HUB="app/src/main/kotlin/dev/yeshua/player/ui/screens/login/UnifiedLoginHub.kt"
          KEYS="app/src/main/kotlin/dev/yeshua/player/constants/PreferenceKeys.kt"
          fail() { echo "::error::$1"; exit 1; }
          [ -f "$HUB" ] || fail "UnifiedLoginHub.kt is missing. Extract the Yeshua overlay zip over the repo, commit, push, then start a FRESH workflow run (Actions > Build Universal APK > Run workflow — not Re-run)."
          grep -q "largeTopAppBarColors" "$HUB" || fail "UnifiedLoginHub.kt looks stale. Re-download the fixed overlay zip, extract, commit, push, then fresh-run the workflow."
          grep -q "ThemePresetIdKey" "$KEYS" || fail "PreferenceKeys.kt is missing the Yeshua keys. Extract the overlay zip, commit, push, then fresh-run the workflow."
          echo "Yeshua overlay verified."

      # ── Java 21 ──────────────────────────────────────────────────────────
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      # ── Gradle cache ─────────────────────────────────────────────────────
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-cleanup: on-success

      # ── Signing ──────────────────────────────────────────────────────────
      # Set KEYSTORE_BASE64, STORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD in
      # Settings → Secrets → Actions.  If absent the build is unsigned (debug-able).
      - name: Decode keystore
        if: ${{ env.KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          mkdir -p app/keystore
          echo "${KEYSTORE_BASE64}" | base64 --decode > app/keystore/release.keystore

      # ── Build ────────────────────────────────────────────────────────────
      - name: Build universal APK
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS:      ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:   ${{ secrets.KEY_PASSWORD }}
          API_BEARER_TOKEN: ${{ secrets.API_BEARER_TOKEN }}
          LASTFM_API_KEY:   ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET:    ${{ secrets.LASTFM_SECRET }}
          DISCORD_APPLICATION_ID: ${{ secrets.DISCORD_APPLICATION_ID || '1547164645817585684' }}
        run: |
          chmod +x gradlew
          ./gradlew \
            :app:assembleGmsMobileUniversalRelease \
            --no-daemon \
            --build-cache \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g" \
            --stacktrace

      # ── Version info ──────────────────────────────────────────────────────
      - name: Resolve version name
        id: ver
        run: |
          VERSION=$(grep -oP '(?<=versionName = ")[^"]+' app/build.gradle.kts | head -1)
          SHORT_SHA="${GITHUB_SHA::7}"
          BRANCH="${GITHUB_REF_NAME}"
          if [ "$BRANCH" = "main" ]; then
            echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
            echo "label=Yeshua-${VERSION}-universal" >> "$GITHUB_OUTPUT"
          else
            echo "tag=nightly-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "label=Yeshua-${VERSION}-${SHORT_SHA}-universal" >> "$GITHUB_OUTPUT"
          fi

      # ── Rename APK ────────────────────────────────────────────────────────
      - name: Rename APK
        id: apk
        run: |
          APK=$(find app/build/outputs/apk \
            -name "*gms*mobile*universal*release*.apk" \
            -o -name "*universal*release*.apk" \
            2>/dev/null | head -1)
          DEST="app/build/outputs/apk/${{ steps.ver.outputs.label }}.apk"
          mv "$APK" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"

      # ── Upload artifact ───────────────────────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.label }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 30

      # ── GitHub Release (main branch only) ────────────────────────────────
      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Yeshua ${{ steps.ver.outputs.tag }}
          body: |
            ## Yeshua ${{ steps.ver.outputs.tag }}

            **Universal APK** — installs on any Android architecture:
            arm64-v8a · armeabi-v7a · x86 · x86_64

            Minimum Android: 8.0 (API 26)

            ### What's new
            See [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)
            or the commits in this release.

            ### Install
            Download `Yeshua-*-universal.apk` below and open it on your device.
            If prompted, enable *Install unknown apps* for your file manager.
          files: ${{ steps.apk.outputs.path }}
          draft: false
          prerelease: false
          generate_release_notes: true
